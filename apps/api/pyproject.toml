[project]
name = "stll-pay-api"
version = "0.1.0"
description = "STLL PAY payment API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["E501"]
