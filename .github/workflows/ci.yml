name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Create roles and databases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f ../../infra/postgres-init.sql
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Dependency audit
        run: uv run pip-audit --progress-spinner off

  web:
    name: Web (lint, types, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency audit (high and critical fail the build)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright, mock payments)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Create roles and databases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f infra/postgres-init.sql
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --trace off
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI scans the whole history. (The gitleaks action fails on a new
      # branch's first push, where the commit range starts before the first commit.)
      - name: Install gitleaks 8.24.3
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          # Published checksum for this release (gitleaks_8.24.3_checksums.txt).
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan full history for secrets
        run: /tmp/gitleaks git . --redact --verbose --exit-code 1
