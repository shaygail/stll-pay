<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>POS: STLL PAY checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1b1b19}a:hover{color:#55534e}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #f5f3ef; color: #1b1b19; font-family: Geist, system-ui, sans-serif; display: grid; grid-template-columns: 420px minmax(0, 1fr);">
  <section aria-label="Order" style="border-right: 1px solid rgba(27,27,25,0.1); padding: 32px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em;">Order #42</h1>
      <span style="font-size: 13px; color: #55534e;">Counter · Till 1</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 16px; border-top: 1px solid rgba(27,27,25,0.1); padding-top: 16px;">
      <div style="display: flex; justify-content: space-between;"><span>Ube latte, iced</span><span style="font-variant-numeric: tabular-nums;">$8.50</span></div>
      <div style="display: flex; justify-content: space-between;"><span>Siomai, 4 pc</span><span style="font-variant-numeric: tabular-nums;">$4.00</span></div>
    </div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid rgba(27,27,25,0.1); padding-top: 16px;">
      <span style="font-size: 15px; color: #55534e;">Total</span>
      <span style="font-size: 34px; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">$12.50</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #55534e;">Payment</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button style="height: 52px; border: 1px solid rgba(27,27,25,0.22); border-radius: 4px; background: transparent; font-family: Geist, system-ui, sans-serif; font-size: 15px; color: #1b1b19;">Cash</button>
        <button style="height: 52px; border: 1px solid rgba(27,27,25,0.22); border-radius: 4px; background: transparent; font-family: Geist, system-ui, sans-serif; font-size: 15px; color: #1b1b19;">EFTPOS</button>
        <button style="height: 52px; border: 1px solid rgba(27,27,25,0.22); border-radius: 4px; background: transparent; font-family: Geist, system-ui, sans-serif; font-size: 15px; color: #1b1b19;">Bank transfer</button>
        <button aria-pressed="true" style="height: 52px; border: 0; border-radius: 4px; background: #1b1b19; color: #f5f3ef; font-family: Geist, system-ui, sans-serif; font-size: 15px; font-weight: 500;">STLL PAY</button>
      </div>
    </div>
  </section>

  <section aria-label="STLL PAY QR code" style="padding: 32px 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.32em;">STLL PAY</span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <span style="font-size: 15px; color: #55534e;">Scan with your phone camera to pay</span>
      <span style="font-size: 56px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums;">$12.50</span>
    </div>
    <div role="img" aria-label="QR code for order 42" style="width: 300px; height: 300px; box-sizing: border-box; padding: 18px; background: #ffffff; border-radius: 4px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr));">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
        <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><div style="background: #1b1b19; aspect-ratio: 1;"></div></sc-if>
        <sc-if value="{{c.off}}" hint-placeholder-val="{{true}}"><div style="aspect-ratio: 1;"></div></sc-if>
      </sc-for>
    </div>
    <div role="status" style="display: flex; align-items: center; gap: 10px; font-size: 15px;">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 1px; background: #55534e;"></span>
      Waiting for customer · expires in 9:41
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: #55534e;">
      <span style="border: 1px solid rgba(27,27,25,0.22); border-radius: 2px; padding: 4px 8px;">1 Waiting</span>
      <span style="border: 1px solid rgba(27,27,25,0.22); border-radius: 2px; padding: 4px 8px;">2 Approving at bank</span>
      <span style="border: 1px solid rgba(27,27,25,0.22); border-radius: 2px; padding: 4px 8px;">3 Processing, don't hand over yet</span>
      <span style="border: 1px solid #4f5e4d; color: #4f5e4d; border-radius: 2px; padding: 4px 8px;">4 Paid, confirmed by bank</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <button style="height: 48px; padding: 0 20px; border: 1px solid rgba(27,27,25,0.22); border-radius: 4px; background: transparent; font-family: Geist, system-ui, sans-serif; font-size: 15px; color: #1b1b19;">Cancel request</button>
      <button style="height: 48px; padding: 0 20px; border: 1px solid rgba(27,27,25,0.22); border-radius: 4px; background: transparent; font-family: Geist, system-ui, sans-serif; font-size: 15px; color: #1b1b19;">Show on customer screen</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var n = 25, cells = [];
    function finder(r, c, r0, c0) {
      var y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      if (y === 0 || y === 6 || x === 0 || x === 6) return true;
      if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return true;
      return false;
    }
    var seed = 42;
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var f = finder(r, c, 0, 0);
        if (f === null) f = finder(r, c, 0, 18);
        if (f === null) f = finder(r, c, 18, 0);
        var on;
        if (f !== null) on = f;
        else if ((r === 7 || c === 7) && (r < 8 && c < 8)) on = false;
        else if ((r === 7 && c > 16) || (c === 17 && r < 8) || (c === 7 && r > 16) || (r === 17 && c < 8)) on = false;
        else { seed = (seed * 1103515245 + 12345) % 2147483648; on = (seed >> 16) % 2 === 0; }
        cells.push({ on: on, off: !on });
      }
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
